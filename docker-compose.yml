version: '3.8'

services:
  bot:
    build: .
    container_name: scraper_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - mongodb
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./bot/modules:/app/bot/modules

  mongodb:
    image: mongo:latest
    container_name: scraper_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
